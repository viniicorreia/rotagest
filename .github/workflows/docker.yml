# Publica a imagem do rotagest-web (Nginx servindo a SPA) no GitHub Container Registry.
# Não faz deploy em servidor: a imagem é o artefato entregue.
#
# VITE_API_URL é embutida no build (Vite) e também define a origem liberada no
# Content-Security-Policy (connect-src). Configure a variável do repositório
#   Settings > Secrets and variables > Actions > Variables > VITE_API_URL
# com a URL pública da API, ex.: https://api.seudominio.com.br/api/v1
# Sem a variável, o build usa o padrão do Dockerfile (http://localhost:3000/api/v1),
# que só serve para testes locais.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build e push para o GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rotagest-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ${{ vars.VITE_API_URL != '' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
